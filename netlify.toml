[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Clean URLs: /about-us serves about-us.html (Netlify does this automatically with pretty URLs)

[[redirects]]
  from = "/linkedin-marketing*"
  to = "/social-media-marketing"
  status = 301
  force = true

[[redirects]]
  from = "/presentation-design*"
  to = "/branding-creative"
  status = 301
  force = true

[[redirects]]
  from = "/video-production*"
  to = "/branding-creative"
  status = 301
  force = true


# Security headers. No MIME sniffing, referrers trimmed to the origin when
# leaving the site, and nobody else may frame our pages (this does not affect
# the HubSpot scheduler we embed, which is the other direction). No CSP here
# on purpose: the theme uses inline scripts and styles and loads GTM, HubSpot
# and Cloudflare, so a policy strict enough to be worth having would need to
# be built and tested against each of those rather than guessed at.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # X-Frame-Options was being stripped somewhere between Netlify and
    # Cloudflare and never reached the browser. frame-ancestors is the modern
    # replacement and does survive. This is deliberately a one-directive CSP:
    # it governs only who may frame our pages, so it cannot break scripts,
    # styles or fonts the way a full policy could.
    Content-Security-Policy = "frame-ancestors 'self'"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
