[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Clean URLs: /about-us serves about-us.html (Netlify does this automatically with pretty URLs)

[[redirects]]
  from = "/linkedin-marketing*"
  to = "/social-media-marketing"
  status = 301
  force = true

[[redirects]]
  from = "/presentation-design*"
  to = "/branding-creative"
  status = 301
  force = true

[[redirects]]
  from = "/video-production*"
  to = "/branding-creative"
  status = 301
  force = true


# Collapse the .html duplicates onto the clean URLs, so each page
# answers on one address only.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:page.html"
  to = "/:page"
  status = 301
  force = true
